name: Downloadable Builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  ios:
    name: iPad/iPhone unsigned IPA artifact
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          cache: true

      - name: Restore production configuration
        shell: bash
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          API_CONFIG_DART: ${{ secrets.API_CONFIG_DART }}
          ASSETS_CONFIG_JSON: ${{ secrets.ASSETS_CONFIG_JSON }}
        run: |
          if [ -z "$FIREBASE_OPTIONS_DART" ] || [ -z "$API_CONFIG_DART" ] || [ -z "$ASSETS_CONFIG_JSON" ]; then
            echo "Missing one or more iOS production configuration secrets."
            exit 1
          fi
          printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart
          printf '%s' "$API_CONFIG_DART" > lib/config/api_config.dart
          printf '%s' "$ASSETS_CONFIG_JSON" > assets/config.json

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Verify unsigned iPad bundle
        shell: bash
        run: |
          APP="build/ios/iphoneos/Runner.app"
          VERSION="$(awk '/^version:/{print $2}' pubspec.yaml)"
          BUILD_NAME="${VERSION%%+*}"
          BUILD_NUMBER="${VERSION##*+}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.victoriaecristo.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$BUILD_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$BUILD_NUMBER"
          /usr/bin/lipo -info "$APP/Runner" | grep -q arm64
          test ! -e "$APP/embedded.mobileprovision"
          test ! -e "$APP/_CodeSignature"

      - name: Package unsigned IPA for sideloading
        id: package
        shell: bash
        run: |
          VERSION="$(awk '/^version:/{print $2}' pubspec.yaml)"
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          /usr/bin/zip -qry "VictoriaEnCristo-iOS-unsigned-v${VERSION}.ipa" Payload
          echo "path=build/ios/ipa/VictoriaEnCristo-iOS-unsigned-v${VERSION}.ipa" >> "$GITHUB_OUTPUT"

      - name: Upload iPad/iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: victoria-en-cristo-ios-unsigned-ipa
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APK artifacts
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_ALLOW_DEBUG_SIGNING_IN_RELEASE: 'true'
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate stub config files
        shell: bash
        run: |
          cp lib/firebase_options.dart.example lib/firebase_options.dart
          cp lib/config/api_config.dart.example lib/config/api_config.dart
          cp assets/config.json.example assets/config.json

      - name: Prepare Android Google Services config
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "0",
              "project_id": "victoria-en-cristo",
              "storage_bucket": "victoria-en-cristo.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.victoriaencristo.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "placeholder"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: victoria-en-cristo-android-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows ZIP artifact
    runs-on: windows-2022
    env:
      GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
      GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate stub config files
        shell: pwsh
        run: |
          Copy-Item lib/firebase_options.dart.example lib/firebase_options.dart
          Copy-Item lib/config/api_config.dart.example lib/config/api_config.dart
          Copy-Item assets/config.json.example assets/config.json

      - name: Build Windows ZIP
        shell: pwsh
        run: ./scripts/build_windows_release.ps1 -Zip

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: victoria-en-cristo-windows
          path: build/VictoriaEnCristo-Windows.zip
          if-no-files-found: error
          retention-days: 30
