# Codemagic — Compila un IPA SIN FIRMAR de la app iOS para instalar con
# Sideloadly (Apple ID gratis, sin Mac, sin cuenta de Apple Developer de pago).
#
# Por que xcodebuild en vez de `flutter build ios --no-codesign`:
#   La app tiene una extension (widget VictoryWidget) y entitlements de App
#   Groups que obligan a Flutter a pedir un "Development Team" aunque uses
#   --no-codesign. Archivamos directo con Xcode desactivando la firma en TODOS
#   los targets (CODE_SIGNING_ALLOWED=NO), lo que produce un .app sin firmar.
#   Sideloadly lo firma despues en tu PC con tu Apple ID gratis.
#
# Uso:
#   1. Este archivo ya esta en GitHub (rama main).
#   2. En Codemagic corre el workflow "ios-unsigned".
#   3. Descarga el .ipa de Artifacts e instalalo con Sideloadly.

workflows:
  ios-unsigned:
    name: iOS unsigned IPA (Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      # Grupo de variables seguras definido en la UI de Codemagic. Contiene:
      #   FIREBASE_OPTIONS_B64  (obligatoria) lib/firebase_options.dart en base64
      #   API_CONFIG_B64        (opcional)    lib/config/api_config.dart en base64
      # Ambos archivos estan gitignored (el repo es publico); sin ellos el
      # kernel_snapshot de Dart falla porque el codigo los importa.
      groups:
        - secrets
      # Fijada a la misma version local que compila bien el proyecto (la que
      # genera el AAB de Android sin errores). "stable" traia una version mas
      # nueva que fallaba en kernel_snapshot con el toolchain de Xcode nuevo.
      flutter: 3.41.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Restaurar archivos secretos (gitignored)
        script: |
          set -e
          if [ -z "${FIREBASE_OPTIONS_B64:-}" ]; then
            echo "ERROR: falta FIREBASE_OPTIONS_B64 en el grupo 'secrets' de Codemagic."
            echo "Sin lib/firebase_options.dart la app no compila (Firebase)."
            exit 1
          fi
          echo "$FIREBASE_OPTIONS_B64" | base64 --decode > lib/firebase_options.dart
          if [ -n "${API_CONFIG_B64:-}" ]; then
            echo "$API_CONFIG_B64" | base64 --decode > lib/config/api_config.dart
          else
            echo "API_CONFIG_B64 no definida; usando stub sin llaves (APIs biblicas de audio deshabilitadas)."
            cp lib/config/api_config.dart.example lib/config/api_config.dart
          fi
          # assets/config.json tambien esta gitignored (declarado en pubspec,
          # el bundler de assets falla sin el). Localmente solo contiene una
          # llave vacia; se genera el mismo stub, o el contenido real si se
          # define CONFIG_JSON_B64.
          if [ -n "${CONFIG_JSON_B64:-}" ]; then
            echo "$CONFIG_JSON_B64" | base64 --decode > assets/config.json
          else
            printf '{\n  "blb_api_key": ""\n}\n' > assets/config.json
          fi
      - name: Flutter pub get
        script: flutter pub get
      - name: Generar config de Flutter (sin compilar)
        script: flutter build ios --release --no-codesign --config-only
      - name: CocoaPods install
        script: |
          cd ios && pod install --repo-update
      - name: Archivar sin firma (Xcode)
        script: |
          set -e
          # -quiet: sin el eco de cada comando de compilacion el log queda
          # corto y cualquier "error:" es visible (antes el error real quedaba
          # enterrado mas alla de las 10,000 lineas que carga el navegador).
          xcodebuild -quiet \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Runner.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""
      - name: Empaquetar IPA sin firmar
        script: |
          set -e
          cd build/Runner.xcarchive/Products/Applications
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          zip -r9 "$CM_BUILD_DIR/app_quitar-unsigned.ipa" Payload
    artifacts:
      - app_quitar-unsigned.ipa
