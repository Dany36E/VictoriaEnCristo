# Codemagic — Compila un IPA SIN FIRMAR de la app iOS para instalar con
# Sideloadly (Apple ID gratis, sin Mac, sin cuenta de Apple Developer de pago).
#
# Uso:
#   1. Sube este archivo a GitHub (rama main).
#   2. En codemagic.io conecta el repo VictoriaEnCristo.
#   3. Corre el workflow "ios-unsigned".
#   4. Descarga el .ipa de los artefactos y firmalo/instalalo con Sideloadly.
#
# El IPA queda SIN firmar a proposito: Sideloadly lo firma en tu PC con tu
# Apple ID gratis al momento de instalar en el iPad.

workflows:
  ios-unsigned:
    name: iOS unsigned IPA (Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: CocoaPods install
        script: |
          cd ios && pod install --repo-update
      - name: Build iOS sin firmar (.app)
        script: |
          flutter build ios --release --no-codesign
      - name: Empaquetar IPA sin firmar
        script: |
          set -e
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          zip -r9 app_quitar-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/*.ipa
