<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Textura de papel crema que se repite sin costuras (stitchTiles). Cambia el color base en el primer rect. -->
  <defs>
    <filter id="manchas" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.80  0 0 0 0 0.70  0 0 0 0 0.52  0 0 0 2.2 -0.85"/>
    </filter>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="3" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0 0.10  0 0 0 0.55 0"/>
    </filter>
    <filter id="fibras" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.045 0.09" numOctaves="2" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.32  0 0 0 1.2 -0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#f6efe2"/>
  <rect width="512" height="512" filter="url(#manchas)" opacity="0.6"/>
  <rect width="512" height="512" filter="url(#fibras)" opacity="0.22"/>
  <rect width="512" height="512" filter="url(#grano)" opacity="0.5"/>
</svg>
